<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste TVPlus+</title>
<style>
body{font-family:-apple-system,Arial,sans-serif;background:#15161b;color:#fff;margin:0;padding:16px}
h1{font-size:20px;color:#f7bf1a;margin:0 0 10px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;margin:4px 0;border-radius:8px;border:0}
button{width:100%;padding:14px;font-size:17px;font-weight:700;background:#e3101e;color:#fff;border:0;border-radius:8px;margin:8px 0}
.r{background:#24252c;border-radius:8px;padding:10px;margin:6px 0;font-size:14px;word-break:break-all}
.ok{border-left:6px solid #2ecc71}.bad{border-left:6px solid #e74c3c}.mid{border-left:6px solid #f7bf1a}
video{width:100%;background:#000;margin-top:8px;border-radius:8px}
</style></head><body>
<h1>Teste do TVPlus+ no iPhone</h1>
<input id="u" placeholder="Usuário" autocapitalize="off"><input id="p" placeholder="Senha" autocapitalize="off"><input id="d" placeholder="DNS extra para testar (opcional), ex.: https://exemplo.com" autocapitalize="off">
<button id="go">TESTAR</button>
<div id="out"></div>
<video id="v" playsinline controls muted></video>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.js"></script>
<script>
var out=document.getElementById("out");
function line(t,c){var d=document.createElement("div");d.className="r "+(c||"");d.textContent=t;out.appendChild(d);return d}
var BASE=["https://yt19.org","https://t.smts.top","https://wempy.online","https://levi25.biz"];var DNS=[];BASE.forEach(function(b){DNS.push(b)});["wempy.online","levi25.biz","t.smts.top"].forEach(function(h){[8443,2053,2083,2087,2096].forEach(function(p){DNS.push("https://"+h+":"+p)})});
function test(base,u,p){
  var ctl=window.AbortController?new AbortController():null;if(ctl)setTimeout(function(){ctl.abort()},8000);
  var url=base+"/player_api.php?username="+encodeURIComponent(u)+"&password="+encodeURIComponent(p);
  var l=line("Testando "+base+" ...","mid");
  return fetch(url,ctl?{signal:ctl.signal}:{}).then(function(r){return r.text().then(function(t){
    var ok=false;try{var j=JSON.parse(t);ok=j.user_info&&String(j.user_info.auth)==="1"}catch(e){}
    l.className="r "+(ok?"ok":"bad");
    l.textContent=base+" → HTTP "+r.status+(ok?" ✅ LOGIN OK":" ❌ resposta: "+t.slice(0,80));
    return ok?base:null;})},
  function(e){l.className="r bad";l.textContent=base+" → ❌ bloqueado ("+e.message+")";return null});
}
document.getElementById("go").onclick=function(){
  out.innerHTML="";var ex=document.getElementById("d").value.trim().replace(/\/+$/,"");if(ex&&DNS.indexOf(ex)<0)DNS.unshift(ex);var u=document.getElementById("u").value.trim(),p=document.getElementById("p").value.trim();
  if(!u||!p){line("Digite usuário e senha","bad");return}
  var found=null,i=0;
  (function next(){
    if(i>=DNS.length){ if(!found) line("Nenhum servidor aceitou o login pelo navegador.","bad"); return; }
    test(DNS[i++],u,p).then(function(ok){ if(ok&&!found){found=ok;canal(ok,u,p)} next(); });
  })();
};
function mask(t,u,p){return String(t).split(u).join("USER").split(encodeURIComponent(u)).join("USER").split(p).join("SENHA").split(encodeURIComponent(p)).join("SENHA")}

function tsTest(base,u,p,c){
  var s=base+"/live/"+encodeURIComponent(u)+"/"+encodeURIComponent(p)+"/"+c.stream_id+".ts";
  if(!window.mpegts){line("Tocador TS não carregou","bad");return}
  line("Suporte a TS neste iPhone: "+(mpegts.isSupported()?"SIM":"NÃO (precisa iOS 17.1+)"),mpegts.isSupported()?"ok":"bad");
  if(!mpegts.isSupported())return;
  var v=document.getElementById("v");v.disableRemotePlayback=true;
  var l=line("Testando TS no canal: "+c.name,"mid"),done=false;
  var pl=mpegts.createPlayer({type:"mpegts",isLive:true,url:s},{enableWorker:false,liveBufferLatencyChasing:true});
  pl.attachMediaElement(v);pl.load();
  v.onplaying=function(){if(!done){done=true;line("✅ TS TOCOU NO iPHONE!","ok")}};
  pl.on(mpegts.Events.ERROR,function(t,d){if(!done){done=true;line("❌ TS não tocou ("+t+" / "+d+")","bad")}});
  setTimeout(function(){if(!done){done=true;line("⏱ TS não começou em 20s","bad")}},20000);
  var x=pl.play();if(x&&x.catch)x.catch(function(){});
}
function canal(base,u,p){
  window.__ts=function(c){tsTest(base,u,p,c)};
  var q=base+"/player_api.php?username="+encodeURIComponent(u)+"&password="+encodeURIComponent(p);
  fetch(q).then(function(r){return r.json()}).then(function(j){
    var f=(j.user_info&&j.user_info.allowed_output_formats)||[];
    line("Formatos liberados nesse usuário: "+(f.length?f.join(", "):"(não informado)"),f.indexOf("m3u8")>=0?"ok":"bad");
  });
  fetch(q+"&action=get_live_streams").then(function(r){return r.json()}).then(function(a){
    var picks=[a[0],a[Math.floor(a.length/2)],a[a.length-1]].filter(Boolean);
    var k=0; var first=picks[0];
    function one(){
      if(k>=picks.length){ if(first) window.__ts(first); return; }
      var c=picks[k++];
      var s=base+"/live/"+encodeURIComponent(u)+"/"+encodeURIComponent(p)+"/"+c.stream_id+".m3u8";
      var l=line("Canal "+k+": "+c.name,"mid");
      fetch(s).then(function(r){return r.text().then(function(t){
        line("Resposta do link (HTTP "+r.status+"): "+mask(t.slice(0,260),u,p).replace(/\n/g," ⏎ "),(t.indexOf("#EXTM3U")===0?"mid":"bad"));
        var v=document.getElementById("v"),done=false;
        function fin(ok,msg){if(done)return;done=true;line(msg,ok?"ok":"bad");v.removeAttribute("src");v.load();one();}
        v.onplaying=function(){fin(true,"✅ Canal "+k+" TOCOU!")};
        v.onerror=function(){fin(false,"❌ Canal "+k+" não tocou (erro "+(v.error&&v.error.code)+")")};
        setTimeout(function(){fin(false,"⏱ Canal "+k+" não começou em 15s")},15000);
        v.src=s;v.play().catch(function(){});
      })},function(e){line("Link bloqueado ("+e.message+")","bad");one()});
    }
    one();
  },function(e){line("Não consegui pegar a lista de canais ("+e.message+")","bad")});
}
</script></body></html>
